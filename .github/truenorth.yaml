# TrueNorth pipeline configuration — xelis-blockchain (Rust cargo workspace).
# Mirrors snoby-demo-org/veruscoin's shape: required-class scans day one
# (FR-58/71, never deferrable) + a BLOCKING build leg, because the project has
# a canonical build that must produce a binary on every commit.
#
#   mode: required  — always on, hard-stops on failure (FR-59/71)
#   mode: blocking  — blocks unless a declared exception exists (FR-13)
#   mode: advisory  — feeds the error budget, never blocks (FR-59/60)

pipeline:
  # v1.1.2 adds the repo-owned .piiignore exclusion list (see .piiignore —
  # upstream API.md timestamps tripped the CREDIT_CARD recognizer on the
  # full-tree deep-scan). Absent file = unchanged behavior for other repos.
  module: github.com/snoby-demo-org/dagger-checks@v2.0.0   # language-agnostic scans (pinned FR-14)
  registry: zot.viporlab.net/demo

planes:
  build: arc-beta
  test: arc-beta

webhook:
  cit_handoff:
    enabled: false
    url: ""
    auth_secret: ""

checks:
  # ---- required class (day one, FR-58) ----
  secrets-scan:      { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  pii-scan:          { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  private-key-check: { enabled: true, mode: required, tier: fast, plane: build, applies: [any] }
  # ---- BUILD LEG (not a scan check): cargo build through the repo Dockerfile.
  # Kaniko-style docker build in-engine: builder stage (cargo-chef) -> artifact
  # gate on target/release/xelis_daemon -> syft SBOM + grype CVE gate ->
  # (staging publish declared in the rust-build block below).
  build:
    enabled: true
    mode: blocking
    # tier: fast — the build runs on EVERY push/merge to the long-lived branch,
    # not only on a deep_scan dispatch. Doctrine: every commit on the integration
    # branch is a release candidate, so every merge is built exactly once and
    # published as staging:sha-<commit>. (Heavy tier would make build opt-in and
    # leave merges unbuilt — "release candidate" in name only.)
    tier: fast
    plane: build
    applies: [rust]
    module: github.com/snoby-demo-org/dagger-checks-rust@v2.0.0
    # Two images per commit (daemon + wallet), one runner pod each; both digests
    # belong to the SAME Freight, so a promotion carries the variant->digest set
    # and prod is only reachable when both are green (doctrine: commit is the
    # release unit, variants are the multiplicity beneath it). Per-variant
    # overrides live in rust-build.variants below. The miner is NOT built here —
    # it has no deployment and the wallet/daemon pair is what ethpow runs.
    matrix:
      daemon: {}
      wallet: {}
    scan:
      enabled: true
      fail_on: high,critical
      ignore_unfixed: true
      sbom_repo: registry.viporlab.net/demo/xelis-sbom
  # ---- not applicable to this repo ----
  test:              { enabled: false, mode: blocking, tier: fast, plane: test,  applies: [any] }
  # clippy compiles the workspace; enable advisory once a cold baseline exists.
  lint:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [rust],
                       module: github.com/snoby-demo-org/dagger-checks-rust@v2.0.0 }
  # cargo fmt --check needs no compile, but upstream is not rustfmt-clean
  # (8121 diffs measured 2026-11-11) — enable once the workspace is formatted;
  # the module's format function is proven working against it.
  format:            { enabled: false, mode: advisory, tier: fast, plane: build, applies: [rust],
                       module: github.com/snoby-demo-org/dagger-checks-rust@v2.0.0 }
  sast:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }
  coverage:          { enabled: false, mode: advisory, tier: fast, plane: test,  applies: [any] }
  sbom:              { enabled: false, mode: advisory, tier: fast, plane: build, applies: [any] }

# Rust build knobs — TOP LEVEL on purpose: keys under checks: are fanned out as
# jobs by the harness (a checks.<key> dispatches a phantom `dagger call <key>`),
# so project layout lives in its own block that only the module reads.
# artifact_path is inside the Dockerfile's `builder` stage (cargo-chef image with
# a shell, so the ELF-magic + --version probes can exec).
rust-build:
  # ARG `app` = the cargo BIN target (the Dockerfile runs `--bin $app`), not
  # the short directory name: upstream's docker-publish matrix passes
  # daemon/miner/wallet and fails cargo-chef with "No workspace package or
  # binary target named 'daemon'" — the bins are xelis_daemon/xelis_miner/xelis_wallet.
  app: xelis_daemon
  binary: xelis_daemon
  # Fork-owned Dockerfile: upstream's is pristine for conflict-free upstream
  # merges. Same stage names (chef/planner/builder/runtime); the runtime stage
  # is debian:12-slim + security upgrade because the distroless base shipped
  # libssl3 3.0.20 and the syft+grype gate hard-failed on fixable CVEs
  # (CVE-2026-75803 critical) — fix the base, don't weaken the gate.
  # Ported from ethpow's deploy tree (Docker.daemon/Dockerfile.vipor): debian
  # runtime + curl/jq + daemon.sh/healthcheck.sh are what the deployed
  # containers actually use. Hardened vs that tree: debian:12-slim + upgrade
  # (their bookworm/trixie bases had fixable libssl3 CVEs) and generic
  # target-cpu, so images run on mixed hosts.
  dockerfile: docker/Dockerfile.daemon
  target: builder
  artifact_path: /tmp/xelis-build/target/release/xelis_daemon
  # Build-once-promote-everywhere: the gated image is pushed by digest as
  # <repo>:sha-<commit> BEFORE anything downstream exists. Kargo (dev -> preprod
  # -> prod) only ever COPIES this digest — nothing is rebuilt after the merge.
  # This tag is the only promotable artifact; git tags are labels, not triggers.
  # One publish repo PER IMAGE: the staging tag stays a plain sha-<commit>, so
  # Kargo can track each image in its own Warehouse subscription without a
  # suffix scheme (`tag_suffix: true` exists for repos that share one repo).
  publish: registry.viporlab.net/demo/xelis-daemon-staging
  # Per-image overrides. `daemon` is the default above (empty overlay); `wallet`
  # is the second artifact built from the same commit. Wallet image = ethpow's
  # Dockerfile.wallet intent (toolchain deps present, minimal runtime, no
  # HEALTHCHECK) on the hardened debian:12-slim base.
  variants:
    daemon: {}
    wallet:
      app: xelis_wallet
      binary: xelis_wallet
      dockerfile: docker/Dockerfile.wallet
      target: builder
      artifact_path: /tmp/xelis-build/target/release/xelis_wallet
      publish: registry.viporlab.net/demo/xelis-wallet-staging
